name: CI Quality Gate & Verification

on:
  push:
    branches: [main, refactor/*]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Repository Verification & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pytest fastapi httpx
          pip install -r requirements-docs.txt

      - name: Validate repository architecture and conventions
        run: python scripts/validate_structure.py

      - name: Validate Markdown links and anchors
        run: python scripts/validate_links.py

      - name: Validate Jupyter notebooks in isolated environments
        run: python scripts/validate_notebooks.py

      - name: Run root integrity test suite
        run: pytest tests/ -v

      - name: Run Starter Kit 1 (Local RAG Agent) test suite
        run: |
          PYTHONPATH=projects/intermediate/starter-local-rag-agent pytest projects/intermediate/starter-local-rag-agent -v

      - name: Run Starter Kit 2 (Local MLOps) test suite
        run: |
          PYTHONPATH=projects/intermediate/starter-local-mlops pytest projects/intermediate/starter-local-mlops/tests -v

      - name: Build MkDocs documentation site
        run: mkdocs build
