<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" height="auto" role="img" aria-label="Animated architecture comparing Vertical MCP Tool calls and Horizontal A2A Agent-to-Agent collaboration">
  <style>
    .bg { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .kicker { font: 700 11px -apple-system, 'Segoe UI', Arial, sans-serif; fill: #2251FF; letter-spacing: 1.6px; }
    .title { font: 700 20px Georgia, 'Times New Roman', serif; fill: #051C2C; }
    .card-navy { fill: #051C2C; }
    .card-blue { fill: #EFF6FF; stroke: #2251FF; stroke-width: 2; }
    .card-tool { fill: #F8FAFC; stroke: #64748B; stroke-width: 1.5; }
    .white-bold { font: 700 13.5px -apple-system, 'Segoe UI', Arial, sans-serif; fill: #FFFFFF; }
    .navy-bold { font: 700 13px -apple-system, 'Segoe UI', Arial, sans-serif; fill: #051C2C; }
    .small { font: 600 11px -apple-system, 'Segoe UI', Arial, sans-serif; fill: #475569; }
  </style>

  <rect x="1" y="1" width="958" height="338" rx="4" class="bg"/>
  <rect x="1" y="1" width="310" height="5" fill="#051C2C"/>
  <rect x="311" y="1" width="380" height="5" fill="#2251FF"/>
  <rect x="691" y="1" width="268" height="5" fill="#00A9F4"/>

  <text x="32" y="34" class="kicker">VISUAL INTUITION  |  AGENT CONNECTIVITY STANDARDS (MCP vs. A2A)</text>
  <text x="32" y="60" class="title">Vertical USB-C Cables (MCP Tools) vs. Horizontal Phone Lines (A2A Peer Agents)</text>
  <line x1="32" y1="74" x2="928" y2="74" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Left Supervisor / Support Agent -->
  <rect x="110" y="102" width="250" height="64" rx="5" class="card-navy"/>
  <text x="235" y="130" text-anchor="middle" class="white-bold">Support Supervisor Agent</text>
  <text x="235" y="150" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#38BDF8">LangGraph / Google ADK</text>

  <!-- Right Remote Peer Agent (Opaque Black Box via A2A) -->
  <rect x="620" y="102" width="250" height="64" rx="5" class="card-blue"/>
  <text x="745" y="130" text-anchor="middle" class="navy-bold">Remote Inventory Agent</text>
  <text x="745" y="150" text-anchor="middle" class="small">/.well-known/agent-card.json</text>

  <!-- HORIZONTAL A2A Path -->
  <path id="a2aPath" d="M 360 134 L 620 134" fill="none" stroke="#2251FF" stroke-width="2.5" stroke-dasharray="6 4"/>
  <rect x="415" y="96" width="150" height="24" rx="12" fill="#2251FF"/>
  <text x="490" y="112" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">A2A (Horizontal Peer)</text>

  <!-- Animated Horizontal A2A Packet -->
  <circle r="6" fill="#2251FF">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M 360 134 L 620 134 L 360 134"/>
  </circle>

  <!-- VERTICAL MCP Paths from Support Agent down to Qdrant & SQL -->
  <path d="M 180 166 L 180 248" fill="none" stroke="#051C2C" stroke-width="2.2"/>
  <path d="M 290 166 L 290 248" fill="none" stroke="#051C2C" stroke-width="2.2"/>

  <rect x="172" y="194" width="126" height="22" rx="11" fill="#051C2C"/>
  <text x="235" y="209" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#38BDF8">MCP (Vertical Tools)</text>

  <!-- Animated Vertical MCP Packets -->
  <circle r="5.5" fill="#00A9F4">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 180 166 L 180 248 L 180 166"/>
  </circle>
  <circle r="5.5" fill="#00A9F4">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M 290 166 L 290 248 L 290 166"/>
  </circle>

  <!-- Bottom MCP Tool Boxes -->
  <rect x="85" y="248" width="140" height="54" rx="4" class="card-tool"/>
  <text x="155" y="272" text-anchor="middle" class="navy-bold">Qdrant Hybrid DB</text>
  <text x="155" y="290" text-anchor="middle" class="small">MCP Search Tool</text>

  <rect x="245" y="248" width="140" height="54" rx="4" class="card-tool"/>
  <text x="315" y="272" text-anchor="middle" class="navy-bold">Read-Only SQL</text>
  <text x="315" y="290" text-anchor="middle" class="small">MCP Query Tool</text>

  <!-- Right Agent Private DB (Hidden behind A2A boundary!) -->
  <line x1="745" y1="166" x2="745" y2="248" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="3 3"/>
  <rect x="640" y="248" width="210" height="54" rx="4" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="745" y="272" text-anchor="middle" class="navy-bold">Private Warehouse ERP</text>
  <text x="745" y="290" text-anchor="middle" class="small">Hidden from Support Agent!</text>
</svg>
