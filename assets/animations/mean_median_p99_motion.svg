<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" height="auto" role="img" aria-label="Animated comparison of Mean vs Median under an extreme outlier and p50/p95/p99 tail latency">
  <style>
    .bg { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .kicker { font: 700 11px -apple-system, 'Segoe UI', Arial, sans-serif; fill: #2251FF; letter-spacing: 1.6px; }
    .title { font: 700 20px Georgia, 'Times New Roman', serif; fill: #051C2C; }
    .sub { font: 400 12.5px -apple-system, 'Segoe UI', Arial, sans-serif; fill: #475569; }
    .label { font: 600 12px -apple-system, 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
    .small { font: 600 11px -apple-system, 'Segoe UI', Arial, sans-serif; fill: #64748B; }
    .axis { stroke: #94A3B8; stroke-width: 1.5; }
    .dot-student { fill: #051C2C; }

    /* Outlier billionaire dot slides from normal range ($30k) out to the extreme right ($1B+) */
    @keyframes outlierSlide {
      0%, 18%   { transform: translateX(0px); }
      50%, 82%  { transform: translateX(520px); }
      100%      { transform: translateX(0px); }
    }
    /* Mean marker gets dragged violently to the right by that single outlier */
    @keyframes meanDrag {
      0%, 18%   { transform: translateX(0px); }
      50%, 82%  { transform: translateX(285px); }
      100%      { transform: translateX(0px); }
    }
    /* Pulse highlight on the rock-solid Median (p50) */
    @keyframes medianPulse {
      0%, 100% { r: 7px; opacity: 0.9; }
      50%      { r: 10px; opacity: 1; }
    }
    /* Coffee line p99 spike bar */
    @keyframes spikeGrow {
      0%, 20%  { width: 42px; }
      50%, 82% { width: 320px; }
      100%     { width: 42px; }
    }

    .outlier-group { animation: outlierSlide 6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .mean-group    { animation: meanDrag 6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .median-ring   { animation: medianPulse 2s ease-in-out infinite; }
    .p99-bar       { animation: spikeGrow 6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }

    @media (prefers-reduced-motion: reduce) {
      .outlier-group, .mean-group, .median-ring, .p99-bar { animation: none; }
    }
  </style>

  <!-- Outer Card + McKinsey Top Accent Bar -->
  <rect x="1" y="1" width="958" height="338" rx="4" class="bg"/>
  <rect x="1" y="1" width="310" height="5" fill="#051C2C"/>
  <rect x="311" y="1" width="380" height="5" fill="#2251FF"/>
  <rect x="691" y="1" width="268" height="5" fill="#00A9F4"/>

  <!-- Header -->
  <text x="32" y="34" class="kicker">VISUAL INTUITION  |  OUTLIERS &amp; TAIL PERCENTILES</text>
  <text x="32" y="60" class="title">Why One Extreme Outlier Breaks the Mean — While Median (p50) Stays Honest</text>
  <line x1="32" y1="74" x2="928" y2="74" stroke="#E2E8F0" stroke-width="1"/>

  <!-- SECTION 1: Bill Gates / Billionaire Walks Into a Cafe -->
  <text x="32" y="100" class="label">1. "A Billionaire Walks Into a Café" (9 Students @ $30k + 1 Outlier)</text>
  <line x1="48" y1="158" x2="880" y2="158" class="axis"/>
  <text x="48" y="178" class="small">$20k</text>
  <text x="175" y="178" class="small">$30k (Typical)</text>
  <text x="740" y="178" class="small">$1B+ Extreme Outlier →</text>

  <!-- 9 Stationary Student Dots clustered around x=190 ($30k) -->
  <circle cx="158" cy="158" r="5.5" class="dot-student"/>
  <circle cx="168" cy="158" r="5.5" class="dot-student"/>
  <circle cx="178" cy="158" r="5.5" class="dot-student"/>
  <circle cx="188" cy="158" r="5.5" class="dot-student"/>
  <circle cx="198" cy="158" r="5.5" class="dot-student"/>
  <circle cx="208" cy="158" r="5.5" class="dot-student"/>
  <circle cx="218" cy="158" r="5.5" class="dot-student"/>
  <circle cx="228" cy="158" r="5.5" class="dot-student"/>
  <circle cx="238" cy="158" r="5.5" class="dot-student"/>

  <!-- Rock-Solid Median Marker at x=198 -->
  <line x1="198" y1="118" x2="198" y2="158" stroke="#2251FF" stroke-width="2.5"/>
  <circle cx="198" cy="158" r="8" fill="none" stroke="#2251FF" stroke-width="2" class="median-ring"/>
  <rect x="128" y="106" width="140" height="22" rx="3" fill="#EFF6FF" stroke="#2251FF" stroke-width="1"/>
  <text x="198" y="121" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#1D4ED8">MEDIAN (p50) = $30k</text>

  <!-- Dragged Mean Marker -->
  <g class="mean-group">
    <line x1="203" y1="132" x2="203" y2="158" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="3 2"/>
    <polygon points="203,154 197,144 209,144" fill="#DC2626"/>
    <rect x="212" y="114" width="176" height="22" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
    <text x="300" y="129" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#B91C1C">MEAN pulled by outlier!</text>
  </g>

  <!-- Sliding Outlier Dot -->
  <g class="outlier-group">
    <circle cx="250" cy="158" r="8" fill="#DC2626"/>
    <text x="250" y="143" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#DC2626">Outlier</text>
  </g>

  <!-- Divider -->
  <line x1="32" y1="198" x2="928" y2="198" stroke="#E2E8F0" stroke-width="1"/>

  <!-- SECTION 2: Coffee Shop / API Latency p50 vs p95 vs p99 -->
  <text x="32" y="222" class="label">2. "The Coffee Shop Line" — Why Production APIs Track p99 Tail Latency, Not Just Average</text>

  <text x="48" y="252" class="small">p50 (Typical User)</text>
  <rect x="190" y="239" width="38" height="16" rx="2" fill="#051C2C"/>
  <text x="238" y="252" class="small">50 ms (Fast)</text>

  <text x="48" y="280" class="small">p95 (95% of Users)</text>
  <rect x="190" y="267" width="68" height="16" rx="2" fill="#2251FF"/>
  <text x="268" y="280" class="small">90 ms (Smooth)</text>

  <text x="48" y="308" class="small" fill="#B91C1C">p99 (Worst 1% Jam)</text>
  <rect x="190" y="295" width="320" height="16" rx="2" fill="#DC2626" class="p99-bar"/>
  <text x="524" y="308" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#B91C1C">3,500 ms spike → 10,000 angry users per 1M requests!</text>
</svg>
