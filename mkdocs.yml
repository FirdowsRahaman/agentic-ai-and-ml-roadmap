          - "12: Incident Troubleshooting Labs": curriculum/05-production-and-practice/12_incident_and_troubleshooting_labs.md
          - "13A: ML Algorithms from Scratch": curriculum/05-production-and-practice/13_algorithms_and_patterns_from_scratch/13a_ml_algorithms.md
          - "13B: AI Systems Patterns from Scratch": curriculum/05-production-and-practice/13_algorithms_and_patterns_from_scratch/13b_system_patterns.md
  - Portfolio Projects:
