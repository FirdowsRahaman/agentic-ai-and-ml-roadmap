site_name: Agentic AI & ML Roadmap
site_description: A practical, production-first AI and ML engineering curriculum from mathematical foundations to distributed agentic systems.
site_author: Firdows Rahaman
repo_url: https://github.com/FirdowsRahaman/agentic-ai-and-ml-roadmap
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - Home: index.md
  - Diagnostic Assessment: assessment-guide.md
  - Getting Started: getting-started.md
  - Roadmap: ROADMAP.md
  - Learning Paths: learning-paths.md
  - Prerequisites: prerequisites.md
  - Curriculum:
      - 1. Foundations:
          - "Overview": curriculum/01-foundations/README.md
          - "01: Python, SQL & Data Stack": curriculum/01-foundations/01_python_sql_and_data_stack.md
          - "02: Math & Statistics": curriculum/01-foundations/02_math_and_statistics.md
      - 2. Core ML & Deep Learning:
          - "Overview": curriculum/02-core-ml-and-dl/README.md
          - "03: Classical ML & RecSys": curriculum/02-core-ml-and-dl/03_classical_ml_and_recsys.md
          - "04A: Core Deep Learning & PyTorch": curriculum/02-core-ml-and-dl/04a_deep_learning_and_pytorch.md
          - "04B: Advanced DL & RL": curriculum/02-core-ml-and-dl/04b_advanced_dl_and_rl.md
      - 3. Modern AI & Generative AI:
          - "Overview": curriculum/03-modern-ai-and-genai/README.md
          - "05A: NLP & Language Models": curriculum/03-modern-ai-and-genai/05a_nlp_and_language_models.md
          - "05B: Computer Vision & Multimodal": curriculum/03-modern-ai-and-genai/05b_computer_vision_and_multimodal.md
          - "06A: LLM Architecture & Inference": curriculum/03-modern-ai-and-genai/06a_llm_architecture_and_inference.md
          - "06B: RAG Engineering": curriculum/03-modern-ai-and-genai/06b_rag_engineering.md
          - "06C: Fine-Tuning & Serving": curriculum/03-modern-ai-and-genai/06c_finetuning_and_serving.md
      - 4. Agentic AI Engineering:
          - "Overview": curriculum/04-agentic-ai/README.md
          - "07: Agent Fundamentals": curriculum/04-agentic-ai/07_agent_fundamentals.md
          - "08: Agent Orchestration": curriculum/04-agentic-ai/08_agent_orchestration.md
          - "09: Multi-Agent Systems, MCP & A2A": curriculum/04-agentic-ai/09_multi_agent_mcp_a2a.md
          - "10: Evals, Safety & FinOps": curriculum/04-agentic-ai/10_agent_evaluation_and_safety.md
      - 5. Production & Practice:
